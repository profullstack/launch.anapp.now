name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json, the same Bun the
      # image (.nixpacks/Dockerfile) pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      # The production server must boot under Bun and answer.
      - name: Standalone server answers under Bun
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 bun server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$code" = 200 ] && { echo "/healthz -> $code"; exit 0; }
            sleep 1
          done
          cat /tmp/server.log; exit 1
